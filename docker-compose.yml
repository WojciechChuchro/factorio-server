# https://hub.docker.com/r/factoriotools/factorio
services:
  factorio:
    image: factoriotools/factorio:stable
    container_name: factorio-server
    restart: unless-stopped
    ports:
      - "34197:34197/udp"   # Game port
      - "27015:27015/tcp"   # RCON port (optional, for remote console)
    volumes:
      - ./data:/factorio
    environment:
      - LOAD_LATEST_SAVE=${LOAD_LATEST_SAVE}
      - GENERATE_NEW_SAVE=${GENERATE_NEW_SAVE}
      - SAVE_NAME=${SAVE_NAME}
      - TOKEN=${FACTORIO_TOKEN}
      - USERNAME=${FACTORIO_USERNAME}
      # NOTE: the image does NOT read a PASSWORD env var.
      # Set the join password via "game_password" in data/config/server-settings.json.
      - RCON_PORT=${RCON_PORT}
      - RCON_PASSWORD=${RCON_PASSWORD}
      - DLC_SPACE_AGE=${DLC_SPACE_AGE}
      - DLC_QUALITY=${DLC_QUALITY}
      - DLC_ELEVATED_RAILS=${DLC_ELEVATED_RAILS}
    mem_limit: 2g
    cpus: "2.0"

  # Optional: RCON web UI for server management
  rcon-web:
    image: itzg/rcon:latest
    container_name: factorio-rcon-ui
    restart: unless-stopped
    ports:
      - "4326:4326"   # Web UI
      - "4327:4327"   # WebSocket
    environment:
      - RWA_SERVER_NAME=Factorio RCON
      - RWA_ADMIN=true
      - RWA_PASSWORD=${RCON_WEB_PASSWORD}
      - RWA_RCON_HOST=factorio
      - RWA_RCON_PORT=${RCON_PORT}
      - RWA_RCON_PASSWORD=${RCON_PASSWORD}
    depends_on:
      - factorio
    profiles:
      - rcon   # Only start with: docker compose --profile rcon up
